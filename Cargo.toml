[workspace]
resolver = "3"
members = ["crates/wh-core", "crates/wh-win", "crates/wh-mac", "crates/wh-browser", "crates/winhands"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

# One place for every shared version. Platform crates (windows, objc2-*) are listed here so wh-win and
# wh-mac pick them up from one table, but only those two crates may depend on them, and only under a
# target-specific section, so wh-core stays free of OS bindings and builds on Windows, macOS and Linux.
[workspace.dependencies]
wh-core = { path = "crates/wh-core" }
wh-win = { path = "crates/wh-win" }
wh-mac = { path = "crates/wh-mac" }
wh-browser = { path = "crates/wh-browser" }

# wh-core (pure Rust, no OS bindings)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
regex = "1.13"
sha2 = "0.11"
getrandom = "0.4"
base64 = "0.23"
png = "0.18"
fast_image_resize = "6.1"
jpeg-encoder = "0.7"

# wh-win (Windows only). Features are added by the code that needs them, keep this list short.
windows = { version = "0.62.2", default-features = false }

# wh-mac (macOS only). Frameworks are enabled per feature when the code that needs them lands (R5).
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false }
objc2-application-services = { version = "0.3.2", default-features = false }
objc2-vision = { version = "0.3.2", default-features = false }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
global-hotkey = "0.8.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# winhands binary (daemon, MCP server, CLI). The daemon is synchronous (one thread per request, like
# the Python ThreadingHTTPServer), so only the MCP stdio server needs an async runtime.
tiny_http = "0.12"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "elicitation"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "time", "sync", "io-std", "io-util"] }

# wh-browser (CDP client for the owner's Brave). One current-thread tokio runtime per browser session, raw
# CDP over a plain ws:// socket to 127.0.0.1, no TLS and no HTTP client crate.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Later phases (not wired to any crate yet): uiautomation 0.25.1, xcap 0.9.8, arboard 3.6.1,
# toml 1.1.7.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# unwind, not abort: the daemon and the MCP server catch a panic per request and answer with an error
# instead of dying (wh_core::daemon::Daemon::handle, winhands::shim::guarded).
panic = "unwind"
