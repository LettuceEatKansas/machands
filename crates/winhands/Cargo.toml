[package]
name = "winhands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "winhands: desktop control for AI agents (daemon, MCP server, CLI)"

[lib]
name = "winhands_lib"
path = "src/lib.rs"

[[bin]]
name = "winhands"
path = "src/main.rs"

# The daemon with no console window (windows_subsystem = "windows"), for a scheduled task to start.
[[bin]]
name = "winhandsd"
path = "src/bin/winhandsd.rs"

[dependencies]
wh-core = { workspace = true }
wh-browser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tiny_http = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
wh-win = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
wh-mac = { workspace = true }

[dev-dependencies]
wh-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
