[package]
name = "wh-win"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "winhands Windows backend (UI Automation, SendInput, GDI/DXGI capture, WinRT OCR). Empty on other OSes."

[dependencies]
wh-core = { workspace = true }

# Everything below is compiled on Windows only; on macOS and Linux this crate is an empty lib.
# Features are listed by the module that needs them, keep this list short.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    # display.rs: monitors, BitBlt, DIB sections
    "Win32_Graphics_Gdi",
    # wnd.rs: DWM cloaked windows
    "Win32_Graphics_Dwm",
    # wnd.rs, input.rs, hotkey.rs: EnumWindows, SendInput, GetGUIThreadInfo, RegisterHotKey
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # init(): per-monitor-v2 DPI awareness
    "Win32_UI_HiDpi",
    # process.rs, launch.rs: OpenProcess, CreateProcess, tokens, NtQueryInformationProcess (parent pid)
    "Win32_System_Threading",
    "Win32_Security",
    "Wdk_System_Threading",
    "Win32_System_Kernel",
    "Win32_System_Diagnostics_ToolHelp",
    # clipboard.rs
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # process.rs: GetExtendedTcpTable (peer_pid)
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    # launch.rs: App Paths, .lnk files (WIN32_FIND_DATAW), the Apps folder, ShellExecute
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    # spawn.rs: GetStdHandle
    "Win32_System_Console",
    # lib.rs, timezone.rs: GetTickCount, SystemTimeToTzSpecificLocalTimeEx
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    # uia*.rs: UI Automation (IUIAutomation, cache requests, patterns), VARIANT and SAFEARRAY results
    "Win32_UI_Accessibility",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    # ocr.rs: Windows.Media.Ocr, SoftwareBitmap from a DataWriter buffer
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }

[lints.rust]
# The Windows backend needs FFI. Every unsafe block carries a one-line SAFETY comment (PLAN ground
# rule 4); clippy enforces it below, so `unsafe_code` itself is allowed in this crate only.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
